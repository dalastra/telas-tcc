<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendEcommerce AI</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
<body>
    <div class="logo">
        <img src="assets/logo.png" alt="Logo da Empresa">
    </div>
    <div class="login-pai">
        <div class="login-container">
            <div class="login-right">
                <h1>EMAIL:</h1>
                <input class="login-input" type="email" placeholder="Digite seu email...">
                <h1>SENHA:</h1>
                <div class="password-container">
                    <input class="login-input" type="password" id="senha" placeholder="Digite sua senha...">
                    <button type="button" id="toggleSenha"><i class="ph ph-eye"></i></button>
                </div>
                <h1>CONFIRMAR SENHA:</h1>
                <div class="password-container">
                    <input class="login-input" type="password" id="confirmarSenha" placeholder="Digite sua senha...">
                    <button type="button" id="toggleConfirmarSenha"><i class="ph ph-eye"></i></button>
                </div>
                <button class ="button-right" onclick="window.location.href='index.html'">LOGIN</button>
            </div>
            <div class="login-left">
                <h1>RECUPERE<br>SUA SENHA</h1>
            </div>
        </div>
    </div>
        
<script src="script.js"></script>
</body>
</html>
